<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a38" />
      <stop offset="40%" stop-color="#0c3f30" />
      <stop offset="100%" stop-color="#06251b" />
    </linearGradient>

    <!-- Golden Yellow Gradient for Ring, Line and Badge -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="35%" stop-color="#f7b900" />
      <stop offset="100%" stop-color="#e6a400" />
    </linearGradient>

    <!-- Bar 1 Gradient (Bright Light Green) -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Bar 2 Gradient (Mid Green) -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Bar 3 Gradient (Deep Green) -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Drop Shadow for Gold Ring & Elements -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02140e" flood-opacity="0.65" />
    </filter>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#02140e" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base (App Icon Frame) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="117" fill="none" stroke="#1b6951" stroke-width="2" opacity="0.4" />

  <!-- Central Content Group with Subtle Elevation -->
  <g filter="url(#softShadow)">
    <!-- Golden Circular Ring -->
    <circle
      cx="256"
      cy="256"
      r="165"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="26"
    />

    <!-- Three Vertical Bar Chart Columns -->
    <!-- Column 1 (Left) -->
    <rect
      x="184"
      y="272"
      width="34"
      height="62"
      rx="6"
      fill="url(#bar1Grad)"
    />

    <!-- Column 2 (Middle) -->
    <rect
      x="234"
      y="230"
      width="34"
      height="104"
      rx="6"
      fill="url(#bar2Grad)"
    />

    <!-- Column 3 (Right) -->
    <rect
      x="284"
      y="194"
      width="34"
      height="140"
      rx="6"
      fill="url(#bar3Grad)"
    />

    <!-- Golden Upward Zigzag Line -->
    <path
      d="M 166 288 L 224 218 L 264 256 L 314 196"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Golden Arrow Head -->
    <path
      d="M 292 188 L 334 168 L 332 216 Z"
      fill="url(#goldGrad)"
      stroke="url(#goldGrad)"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>

  <!-- Golden Circular "K" Badge at Lower Right -->
  <g filter="url(#badgeShadow)">
    <circle
      cx="326"
      cy="318"
      r="54"
      fill="url(#goldGrad)"
    />
    <!-- The bold 'K' letter inside the badge -->
    <text
      x="326"
      y="322"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="64"
      fill="#0c1813"
      letter-spacing="-1"
    >K</text>
  </g>
</svg>
