        <path d="M18 26l6 6 12-12" stroke="#6ee7b7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Títulos do Tesouro Nacional (OT e BT)</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Rentabilidade de até 17,25% a.a. com garantia estatal</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="26" cy="26" r="26" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#6ee7b7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Ações na Bolsa de Valores (BODIVA)</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Aprenda a investir em ações de bancos angolanos (BAI, Caixa)</text>
      </g>
      <g transform="translate(0, 150)">
