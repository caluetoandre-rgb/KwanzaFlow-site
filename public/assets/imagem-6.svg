          <text x="350" y="27" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">18.500 Kz</text>
          <text x="350" y="45" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">+1,2% ▲</text>
