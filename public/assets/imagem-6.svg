        <path d="M18 26l6 6 12-12" stroke="#6ee7b7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Simulador de Juros Compostos</text>
