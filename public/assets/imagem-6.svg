<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradiente Fundo BODIVA & Investimentos (Esmeralda Profundo / Ouro / Índigo) -->
    <radialGradient id="bg-grad-6" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#063529" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#04211a" />
      <stop offset="100%" stop-color="#02120e" />
    </radialGradient>

    <!-- Brilho Dourado BODIVA e Esmeralda -->
    <radialGradient id="glow-6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass-reflection-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="phone-rim-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-bodiva" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <filter id="shadow-deep-6" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-phone2-6" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badge-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-6)" />
  <circle cx="1400" cy="540" r="580" fill="url(#glow-6)" />

  <g opacity="0.08" stroke="#10b981" stroke-width="1.5">
    <circle cx="1380" cy="540" r="700" fill="none" stroke-dasharray="12 16" />
    <circle cx="1380" cy="540" r="850" fill="none" />
  </g>

  <!-- ==================== LADO ESQUERDO: COPYWRITING BODIVA ==================== -->
  <g transform="translate(110, 150)">
    <g filter="url(#badge-glow-green)">
      <rect width="360" height="44" rx="22" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="22" r="6" fill="#10b981" />
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#6ee7b7" letter-spacing="1.5">6. EDUCAÇÃO &amp; INVESTIMENTOS</text>
    </g>

    <g transform="translate(0, 95)">
