        <g transform="translate(0, 190)">
          <rect width="330" height="74" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
          <circle cx="34" cy="37" r="18" fill="#fef3c7" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">03</text>
          <text x="64" y="30" font-family="sans-serif" font-size="14" font-weight="900" fill="#92400e">Outubro • Manuel Domingos</text>
