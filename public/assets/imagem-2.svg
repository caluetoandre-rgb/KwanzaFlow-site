          <text x="284" y="37" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">RECEBIDO</text>
        </g>

        <!-- Ronda 2: Concluída -->
        <g transform="translate(0, 112)">
          <rect width="330" height="66" rx="14" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="34" cy="33" r="18" fill="#ecfdf5" />
          <text x="34" y="39" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">02</text>
