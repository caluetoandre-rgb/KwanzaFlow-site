          <text x="34" y="39" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">01</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Agosto • Sofia Mendes</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#059669">✓ Bolada de 400.000 Kz Paga</text>
