          <circle cx="34" cy="33" r="18" fill="#f1f5f9" />
          <text x="34" y="39" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">04</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Novembro • Teresa Santos</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#64748b">Agendado para 15 de Nov</text>
        </g>

        <!-- Ronda 5 -->
        <g transform="translate(0, 354)">
          <rect width="330" height="66" rx="14" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="34" cy="33" r="18" fill="#f1f5f9" />
          <text x="34" y="39" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">05</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Dezembro • Paulo Gaspar</text>
