          <text x="30" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">TS</text>
          <text x="56" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">Teresa dos Santos</text>
