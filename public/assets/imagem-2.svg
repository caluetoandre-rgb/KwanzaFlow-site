<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradiente Fundo Kixikila & Poupança -->
    <radialGradient id="bg-grad-2" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#053328" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#041f19" />
      <stop offset="100%" stop-color="#02110e" />
    </radialGradient>

    <!-- Brilho Ambiente Âmbar/Dourado e Esmeralda -->
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass-reflection-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="phone-rim-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-kixikila" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="shadow-deep-2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-phone2-2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badge-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-2)" />
  <circle cx="1420" cy="540" r="580" fill="url(#glow-2)" />

  <!-- Detalhes de Fundo -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1.5">
    <circle cx="1400" cy="540" r="680" fill="none" stroke-dasharray="10 14" />
    <circle cx="1400" cy="540" r="820" fill="none" />
  </g>

  <!-- ==================== LADO ESQUERDO: COPYWRITING KIXIKILA ==================== -->
  <g transform="translate(110, 150)">
    <!-- Badge -->
    <g filter="url(#badge-glow-amber)">
      <rect width="340" height="44" rx="22" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="24" cy="22" r="6" fill="#f59e0b" />
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#fcd34d" letter-spacing="1.5">2. POUPANÇA &amp; FAMÍLIA</text>
    </g>

    <!-- Título Principal -->
    <g transform="translate(0, 95)">
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#10b981" letter-spacing="-1.5">Faça suas</text>
      <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#10b981" letter-spacing="-1.5">poupanças</text>
      <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">em família</text>
      <text x="0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="600" fill="#e2e8f0" letter-spacing="-0.5">e alcance suas metas.</text>
      <text x="0" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#fbbf24" letter-spacing="-0.5">A Kixikila Angolana Digital 🇦🇴</text>
    </g>

    <!-- Três Pontos de Destaque -->
    <g transform="translate(0, 620)">
      <!-- Item 1 -->
      <g>
        <circle cx="26" cy="26" r="26" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Organize as finanças em família</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Metas conjuntas para reformas, carro ou terreno</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 75)">
        <circle cx="26" cy="26" r="26" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Defina metas e construa seu futuro</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Kixikila transparente com sorteio automático</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 150)">
        <circle cx="26" cy="26" r="26" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Acompanhe contribuições &amp; lembretes</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Notificações amigáveis via Multicaixa e Unitel</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: DOIS SMARTPHONES KIXIKILA ==================== -->

  <!-- TELEFONE 2 (FUNDO: CALENDÁRIO DAS RONDAS E BENEFICIÁRIOS) -->
  <g transform="translate(950, 140) rotate(-6)" filter="url(#shadow-phone2-2)">
    <rect x="0" y="0" width="390" height="820" rx="44" fill="#1e293b" stroke="url(#phone-rim-2)" stroke-width="5" />
    <rect x="6" y="6" width="378" height="808" rx="39" fill="#0f172a" />
    <rect x="10" y="10" width="370" height="800" rx="36" fill="#f8fafc" />

