          <circle cx="30" cy="28" r="16" fill="#eff6ff" />
          <text x="30" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">CF</text>
          <text x="56" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Carlos Fernandes</text>
          <text x="56" y="40" font-family="sans-serif" font-size="11" fill="#059669">✓ Quota Paga • MCX Express</text>
          <rect x="295" y="16" width="59" height="24" rx="6" fill="#ecfdf5" />
          <text x="324" y="32" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">PAGO</text>
        </g>

        <!-- Membro 3: Sofia -->
        <g transform="translate(0, 158)">
          <rect width="366" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="30" cy="28" r="16" fill="#fdf2f8" />
          <text x="30" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#be185d">SM</text>
          <text x="56" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Sofia Mendes</text>
          <text x="56" y="40" font-family="sans-serif" font-size="11" fill="#059669">✓ Quota Paga • BFA Net</text>
          <rect x="295" y="16" width="59" height="24" rx="6" fill="#ecfdf5" />
          <text x="324" y="32" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">PAGO</text>
        </g>

