<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradiente Fundo Dívidas (Carmesim Nobre / Ardósia Noturno) -->
    <radialGradient id="bg-grad-5" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3b0714" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#2a050f" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#19040a" />
      <stop offset="100%" stop-color="#0a0204" />
    </radialGradient>

    <!-- Brilho Carmesim & Esmeralda de Superação -->
    <radialGradient id="glow-5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b0714" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass-reflection-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="phone-rim-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-debt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <filter id="shadow-deep-5" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-phone2-5" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badge-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-5)" />
  <circle cx="1400" cy="540" r="580" fill="url(#glow-5)" />

  <g opacity="0.08" stroke="#f43f5e" stroke-width="1.5">
    <circle cx="1380" cy="540" r="700" fill="none" stroke-dasharray="10 14" />
    <circle cx="1380" cy="540" r="850" fill="none" />
  </g>

  <!-- ==================== LADO ESQUERDO: COPYWRITING DÍVIDAS ==================== -->
  <g transform="translate(110, 150)">
    <g filter="url(#badge-glow-rose)">
      <rect width="360" height="44" rx="22" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="24" cy="22" r="6" fill="#f43f5e" />
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#fda4af" letter-spacing="1.5">5. ELIMINAÇÃO DE DÍVIDAS</text>
    </g>

    <g transform="translate(0, 95)">
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#10b981" letter-spacing="-1.5">Quite Dívidas</text>
      <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-1.5">e Faça Gestão</text>
      <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-1.5">de Empréstimos</text>
      <text x="0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#fda4af" letter-spacing="-0.5">Métodos Estratégicos: Bola de Neve e Avalanche</text>
    </g>

    <g transform="translate(0, 620)">
      <g>
        <circle cx="26" cy="26" r="26" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fda4af" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Método Avalanche Científico</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Elimine primeiro as dívidas com maiores juros bancários</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="26" cy="26" r="26" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fda4af" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Cronograma Real de Quitação</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Saiba a data exata em que você se tornará 100% livre</text>
      </g>
      <g transform="translate(0, 150)">
        <circle cx="26" cy="26" r="26" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#fda4af" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Economia de Dezenas de Milhares de Kwanzas</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Evite multas por atraso e negocie prazos melhores</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: DOIS SMARTPHONES ==================== -->

  <!-- TELEFONE 2 (FUNDO: GRÁFICO DA CURVA DE QUITAÇÃO DA DÍVIDA) -->
  <g transform="translate(950, 140) rotate(-6)" filter="url(#shadow-phone2-5)">
    <rect x="0" y="0" width="390" height="820" rx="44" fill="#1e293b" stroke="url(#phone-rim-5)" stroke-width="5" />
    <rect x="6" y="6" width="378" height="808" rx="39" fill="#0f172a" />
    <rect x="10" y="10" width="370" height="800" rx="36" fill="#f8fafc" />

    <g transform="translate(10, 10)">
      <rect width="370" height="38" fill="#ffffff" />
      <text x="26" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">09:41</text>
      <circle cx="185" cy="20" r="5.5" fill="#0f172a" />
      <path d="M320 16h18v10h-18z" fill="#0f172a" rx="3" />

      <rect y="38" width="370" height="54" fill="#ffffff" />
      <text x="24" y="72" font-family="sans-serif" font-size="17" font-weight="900" fill="#0f172a">Curva de Eliminação</text>
      <line x1="0" y1="92" x2="370" y2="92" stroke="#e2e8f0" stroke-width="1" />

      <!-- Gráfico Decrescente -->
      <g transform="translate(24, 120)">
        <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">PROJEÇÃO: DÍVIDA ZERO EM 7 MESES</text>
        
        <!-- Curva SVG -->
        <path d="M 10 180 Q 80 140, 160 90 T 310 20" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
        <path d="M 10 180 L 310 180" stroke="#e2e8f0" stroke-width="1" />
        
        <!-- Pontos e Meses -->
        <circle cx="10" cy="180" r="6" fill="#e11d48" />
        <text x="10" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Hoje</text>

        <circle cx="160" cy="90" r="6" fill="#f59e0b" />
        <text x="160" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Mês 4</text>

        <circle cx="310" cy="20" r="7" fill="#10b981" />
        <text x="310" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#059669">Maio (Zero!)</text>

        <!-- Card de Conquista -->
        <g transform="translate(0, 240)">
          <rect width="322" height="110" rx="16" fill="#ecfdf5" stroke="#a7f3d0" />
          <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="900" fill="#065f46">🎉 Economia Total Prevista:</text>
          <text x="20" y="65" font-family="sans-serif" font-size="26" font-weight="900" fill="#059669">68.000,00 Kz</text>
          <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#047857">Economizados em juros abusivos</text>
        </g>
      </g>
    </g>

    <rect x="10" y="10" width="370" height="800" rx="36" fill="url(#glass-reflection-5)" pointer-events="none" />
  </g>

  <!-- TELEFONE 1 (DESTAQUE: PAINEL DE DÍVIDAS E ESTRATÉGIA AVALANCHE) -->
  <g transform="translate(1320, 80) rotate(3)" filter="url(#shadow-deep-5)">
    <rect x="0" y="0" width="430" height="900" rx="50" fill="#0f172a" stroke="url(#phone-rim-5)" stroke-width="6" />
    <rect x="8" y="8" width="414" height="884" rx="44" fill="#1e293b" />
    <rect x="12" y="12" width="406" height="876" rx="40" fill="#f8fafc" />

    <g transform="translate(12, 12)">
      <!-- Barra Superior Android -->
      <rect width="406" height="42" fill="#4c0519" rx="40" />
      <rect y="20" width="406" height="22" fill="#4c0519" />
      <text x="32" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">09:41</text>
      <circle cx="203" cy="24" r="6" fill="#200108" />
      <path d="M350 20h22v11h-22z" fill="#ffffff" rx="3" />

      <!-- Top Header Gestão de Dívidas -->
      <rect y="42" width="406" height="66" fill="#4c0519" />
      <circle cx="44" cy="74" r="18" fill="#f43f5e" />
      <text x="44" y="80" text-anchor="middle" font-size="16">🛡️</text>
      <text x="74" y="70" font-family="sans-serif" font-size="12" fill="#fbcfe8">Libertação Financeira</text>
      <text x="74" y="88" font-family="sans-serif" font-size="17" font-weight="900" fill="#ffffff">Plano de Quitação de Dívidas</text>

      <!-- CARTÃO PRINCIPAL: DÍVIDA TOTAL -->
      <g transform="translate(20, 124)">
        <rect width="366" height="185" rx="22" fill="url(#card-debt)" filter="url(#badge-glow-rose)" />
        <circle cx="330" cy="40" r="75" fill="#ffffff" opacity="0.1" />

        <text x="24" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffe4e6" letter-spacing="1">DÍVIDA TOTAL RESTANTE</text>
        <text x="24" y="84" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff">520.000,00 Kz</text>
        
        <rect x="24" y="100" width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="37" cy="113" r="5" fill="#4ade80" />
        <text x="48" y="117" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Reduziu -24% em 60 dias</text>

        <line x1="24" y1="138" x2="342" y2="138" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
        <text x="24" y="162" font-family="sans-serif" font-size="11" fill="#ffe4e6">Estratégia Recomendada:</text>
        <text x="175" y="162" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff">Método Avalanche</text>
      </g>

      <!-- SELETOR DE ESTRATÉGIA -->
      <g transform="translate(20, 325)">
        <rect width="366" height="46" rx="14" fill="#e2e8f0" />
        <rect x="4" y="4" width="175" height="38" rx="12" fill="#ffffff" />
        <text x="91" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#be123c">Avalanche (Menor Juro)</text>
        <text x="270" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">Bola de Neve</text>
      </g>

      <!-- LISTA DE DÍVIDAS POR ORDEM DE PRIORIDADE -->
      <g transform="translate(20, 390)">
        <text x="0" y="18" font-family="sans-serif" font-size="15" font-weight="900" fill="#0f172a">Dívidas Cadastradas</text>
        <text x="366" y="18" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#be123c">+ Nova Dívida</text>

        <!-- Dívida 1: BFA (Juros 24% a.a.) -->
        <g transform="translate(0, 30)">
          <rect width="366" height="74" rx="16" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" />
          <circle cx="34" cy="37" r="18" fill="#ffe4e6" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#be123c">#1</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">Empréstimo Pessoal BFA</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#be123c">Taxa de Juros: 24% a.a. (Prioridade Máxima)</text>
          <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#64748b">Saldo Restante: 280.000 Kz</text>
          <rect x="270" y="24" width="84" height="26" rx="8" fill="#f43f5e" />
          <text x="312" y="41" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">AMORTIZAR</text>
        </g>

        <!-- Dívida 2: BAI -->
        <g transform="translate(0, 114)">
          <rect width="366" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="34" cy="37" r="18" fill="#f1f5f9" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">#2</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">Cartão de Crédito BAI</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#64748b">Taxa de Juros: 19% a.a.</text>
          <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#64748b">Saldo: 140.000 Kz • Parcela 25.000 Kz</text>
          <rect x="280" y="24" width="74" height="26" rx="8" fill="#e2e8f0" />
          <text x="317" y="41" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">MÍNIMO</text>
        </g>

        <!-- Dívida 3: Fornecedor Armazém -->
        <g transform="translate(0, 198)">
          <rect width="366" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="34" cy="37" r="18" fill="#f1f5f9" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">#3</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">Fiado Fornecedor (Armazém)</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#64748b">Sem juros acordado</text>
          <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#64748b">Saldo: 100.000 Kz</text>
          <rect x="280" y="24" width="74" height="26" rx="8" fill="#e2e8f0" />
          <text x="317" y="41" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">MÍNIMO</text>
        </g>
      </g>

      <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
      <g transform="translate(0, 810)">
        <rect width="406" height="66" fill="#ffffff" />
        <line x1="0" y1="0" x2="406" y2="0" stroke="#e2e8f0" stroke-width="1" />
        <rect x="153" y="52" width="100" height="4" rx="2" fill="#cbd5e1" />
      </g>
    </g>

    <rect x="12" y="12" width="406" height="876" rx="40" fill="url(#glass-reflection-5)" pointer-events="none" />
  </g>
</svg>
