<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradiente Fundo IA & Scanner (Azul Escuro / Safira / Esmeralda) -->
    <radialGradient id="bg-grad-4" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c2540" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#071a2e" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#04111f" />
      <stop offset="100%" stop-color="#020810" />
    </radialGradient>

    <!-- Brilho IA Azul Safira & Ciano -->
    <radialGradient id="glow-4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0c2540" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass-reflection-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="phone-rim-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="shadow-deep-4" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-phone2-4" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badge-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-4)" />
  <circle cx="1400" cy="540" r="580" fill="url(#glow-4)" />

  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="1380" cy="540" r="700" fill="none" stroke-dasharray="10 16" />
    <circle cx="1380" cy="540" r="850" fill="none" />
  </g>

  <!-- ==================== LADO ESQUERDO: COPYWRITING IA & SCANNER ==================== -->
  <g transform="translate(110, 150)">
    <g filter="url(#badge-glow-blue)">
      <rect width="360" height="44" rx="22" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="24" cy="22" r="6" fill="#38bdf8" />
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#7dd3fc" letter-spacing="1.5">4. INTELIGÊNCIA ARTIFICIAL &amp; SMS</text>
    </g>

    <g transform="translate(0, 95)">
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#38bdf8" letter-spacing="-1.5">Consultoria</text>
      <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Financeira com IA</text>
      <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" letter-spacing="-1">e registro automático</text>
      <text x="0" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#38bdf8" letter-spacing="-1">com foto na fatura 📸</text>
    </g>

    <g transform="translate(0, 600)">
      <g>
        <circle cx="26" cy="26" r="26" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Scanner OCR Inteligente</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Basta tirar foto do talão Multicaixa para lançar despesas</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="26" cy="26" r="26" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Leitura de SMS Bancários (BAI, BFA, BIC)</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Identificação automática de compras e transferências</text>
      </g>
      <g transform="translate(0, 150)">
        <circle cx="26" cy="26" r="26" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Consultor Financeiro 24h na Palma da Mão</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Dicas personalizadas para o custo de vida em Angola</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: DOIS SMARTPHONES ==================== -->

  <!-- TELEFONE 2 (FUNDO: SCANNER OCR DE TALÃO MULTICAIXA) -->
  <g transform="translate(950, 140) rotate(-6)" filter="url(#shadow-phone2-4)">
    <rect x="0" y="0" width="390" height="820" rx="44" fill="#1e293b" stroke="url(#phone-rim-4)" stroke-width="5" />
    <rect x="6" y="6" width="378" height="808" rx="39" fill="#0f172a" />
    <rect x="10" y="10" width="370" height="800" rx="36" fill="#0f172a" />

    <g transform="translate(10, 10)">
      <rect width="370" height="38" fill="#0f172a" />
      <text x="26" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">09:41</text>
      <circle cx="185" cy="20" r="5.5" fill="#1e293b" />
      <path d="M320 16h18v10h-18z" fill="#ffffff" rx="3" />

      <!-- Visor da Câmera / Scanner -->
      <rect y="38" width="370" height="762" fill="#1e293b" />
      
      <!-- Papel do Talão Simulado -->
      <g transform="translate(35, 90)">
        <rect width="300" height="520" rx="8" fill="#ffffff" />
        <!-- Serrilhado topo do talão -->
        <line x1="20" y1="40" x2="280" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />
        <text x="150" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#0f172a">MULTICAIXA ANGOLA</text>
        <text x="150" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">KERO HIPERMERCADO - NOVA VIDA</text>
        
        <line x1="20" y1="110" x2="280" y2="110" stroke="#e2e8f0" stroke-width="1" />
        <text x="25" y="135" font-family="monospace" font-size="11" fill="#475569">01 LEITE UHT 1L ........... 1.250 Kz</text>
        <text x="25" y="160" font-family="monospace" font-size="11" fill="#475569">02 ARROZ 5KG .............. 7.800 Kz</text>
        <text x="25" y="185" font-family="monospace" font-size="11" fill="#475569">01 FRANGO CONG ............ 5.400 Kz</text>
        
        <!-- Caixa de Destaque OCR da IA -->
        <rect x="15" y="210" width="270" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
        <text x="25" y="235" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">VALOR DETECTADO PELA IA:</text>
        <text x="25" y="258" font-family="sans-serif" font-size="18" font-weight="900" fill="#047857">TOTAL: 14.450,00 Kz</text>

        <!-- Selo de Leitura Bem-sucedida -->
        <rect x="15" y="320" width="270" height="40" rx="8" fill="#0284c7" />
        <text x="150" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">✓ Categoria: Alimentação (50%)</text>
      </g>

      <!-- Mira da Câmera -->
      <g stroke="#38bdf8" stroke-width="3" fill="none">
        <path d="M 45 100 L 25 100 L 25 120" />
        <path d="M 325 100 L 345 100 L 345 120" />
        <path d="M 45 600 L 25 600 L 25 580" />
        <path d="M 325 600 L 345 600 L 345 580" />
      </g>
    </g>

    <rect x="10" y="10" width="370" height="800" rx="36" fill="url(#glass-reflection-4)" pointer-events="none" />
  </g>

  <!-- TELEFONE 1 (DESTAQUE: CONVERSA COM ASSISTENTE FINANCEIRO IA) -->
  <g transform="translate(1320, 80) rotate(3)" filter="url(#shadow-deep-4)">
    <rect x="0" y="0" width="430" height="900" rx="50" fill="#0f172a" stroke="url(#phone-rim-4)" stroke-width="6" />
    <rect x="8" y="8" width="414" height="884" rx="44" fill="#1e293b" />
    <rect x="12" y="12" width="406" height="876" rx="40" fill="#f8fafc" />

    <g transform="translate(12, 12)">
      <!-- Barra Superior Android -->
      <rect width="406" height="42" fill="#082f49" rx="40" />
      <rect y="20" width="406" height="22" fill="#082f49" />
      <text x="32" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">09:41</text>
      <circle cx="203" cy="24" r="6" fill="#031a28" />
      <path d="M350 20h22v11h-22z" fill="#ffffff" rx="3" />

      <!-- Header Assistente IA KwanzaFlow -->
      <rect y="42" width="406" height="66" fill="#082f49" />
      <circle cx="44" cy="74" r="18" fill="#38bdf8" />
      <text x="44" y="80" text-anchor="middle" font-size="17">🤖</text>
      <text x="74" y="70" font-family="sans-serif" font-size="12" fill="#bae6fd">Inteligência Financeira 24h</text>
      <text x="74" y="88" font-family="sans-serif" font-size="17" font-weight="900" fill="#ffffff">Consultor IA KwanzaFlow</text>

      <!-- CHAT INTERATIVO COM A IA -->
      <g transform="translate(16, 125)">
        
        <!-- Mensagem do Usuário -->
        <g transform="translate(80, 0)">
          <rect width="290" height="52" rx="16" fill="#0284c7" />
          <text x="18" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Como posso poupar mais 40.000 Kz?</text>
        </g>

        <!-- Resposta da IA KwanzaFlow -->
        <g transform="translate(0, 68)">
          <rect width="374" height="260" rx="18" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5" filter="url(#shadow-phone2-4)" />
          
          <circle cx="28" cy="28" r="14" fill="#e0f2fe" />
          <text x="28" y="34" text-anchor="middle" font-size="13">✨</text>
          <text x="50" y="33" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369a1">Análise dos Gastos de Setembro:</text>

          <text x="20" y="66" font-family="sans-serif" font-size="12" fill="#334155" leading="18">
            <tspan x="20" dy="0">Olá André! Analisei os seus lançamentos:</tspan>
            <tspan x="20" dy="24">• Você gastou <tspan font-weight="bold" fill="#e11d48">54.000 Kz</tspan> em restaurantes no Talatona</tspan>
            <tspan x="20" dy="20">  (superou o seu teto de 30% em 18.000 Kz).</tspan>
            <tspan x="20" dy="24">• Limitar saídas a fins de semana poupa <tspan font-weight="bold" fill="#059669">28.000 Kz</tspan>.</tspan>
            <tspan x="20" dy="24">• Ajustando o plano de dados, poupa mais <tspan font-weight="bold" fill="#059669">12.000 Kz</tspan>.</tspan>
            <tspan x="20" dy="26" font-weight="bold" fill="#0f172a">Total de economia projetada: 40.000 Kz/mês!</tspan>
          </text>

          <!-- Botão de Ação Sugerido pela IA -->
          <rect x="20" y="205" width="334" height="42" rx="12" fill="#0284c7" />
          <text x="187" y="231" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Aplicar Ajuste no Orçamento 50/30/20 ✓</text>
        </g>

        <!-- CARD NOTIFICAÇÃO DE SMS DETECTADO -->
        <g transform="translate(0, 345)">
          <rect width="374" height="95" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
          <circle cx="28" cy="28" r="14" fill="#bae6fd" />
          <text x="28" y="34" text-anchor="middle" font-size="13">💬</text>
          <text x="50" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">SMS Bancário Detectado (BAI Directo)</text>
          
          <text x="20" y="58" font-family="sans-serif" font-size="11" fill="#475569">"Compra Multicaixa de Kz 12.800 em Farmácia Popular aprovada."</text>
          
          <rect x="20" y="66" width="130" height="20" rx="6" fill="#10b981" />
          <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Lançado: Saúde ✓</text>
        </g>
      </g>

      <!-- BARRA DE ENTRADA DO CHAT -->
      <g transform="translate(16, 735)">
        <rect width="374" height="54" rx="27" fill="#ffffff" stroke="#cbd5e1" />
        <text x="24" y="33" font-family="sans-serif" font-size="13" fill="#94a3b8">Pergunte algo ao Assistente IA...</text>
        <circle cx="342" cy="27" r="19" fill="#0284c7" />
        <text x="342" y="33" text-anchor="middle" font-size="15" fill="#ffffff">➤</text>
      </g>

      <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
      <g transform="translate(0, 810)">
        <rect width="406" height="66" fill="#ffffff" />
        <line x1="0" y1="0" x2="406" y2="0" stroke="#e2e8f0" stroke-width="1" />
        <rect x="153" y="52" width="100" height="4" rx="2" fill="#cbd5e1" />
      </g>
    </g>

    <rect x="12" y="12" width="406" height="876" rx="40" fill="url(#glass-reflection-4)" pointer-events="none" />
  </g>
</svg>
