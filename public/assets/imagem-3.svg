        <circle cx="26" cy="26" r="26" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#5eead4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">DRE: Lucro Real sem Complicações</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Separe o dinheiro de casa do dinheiro do negócio</text>
      </g>
      <g transform="translate(0, 75)">
        <circle cx="26" cy="26" r="26" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#5eead4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Caderno de Fiados com Cobrança WhatsApp</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Lembretes automáticos para clientes com pagamentos em atraso</text>
      </g>
      <g transform="translate(0, 150)">
        <circle cx="26" cy="26" r="26" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
        <path d="M18 26l6 6 12-12" stroke="#5eead4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Gestão de Estoque e Ponto de Reposição</text>
        <text x="68" y="48" font-family="sans-serif" font-size="17" fill="#94a3b8">Saiba exatamente quando comprar mais mercadoria</text>
      </g>
    </g>
  </g>

  <!-- ==================== LADO DIREITO: DOIS SMARTPHONES ==================== -->

  <!-- TELEFONE 2 (FUNDO: CADERNO DE FIADOS) -->
  <g transform="translate(950, 140) rotate(-6)" filter="url(#shadow-phone2-3)">
    <rect x="0" y="0" width="390" height="820" rx="44" fill="#1e293b" stroke="url(#phone-rim-3)" stroke-width="5" />
    <rect x="6" y="6" width="378" height="808" rx="39" fill="#0f172a" />
    <rect x="10" y="10" width="370" height="800" rx="36" fill="#f8fafc" />

    <g transform="translate(10, 10)">
      <rect width="370" height="38" fill="#ffffff" />
      <text x="26" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">09:41</text>
      <circle cx="185" cy="20" r="5.5" fill="#0f172a" />
      <path d="M320 16h18v10h-18z" fill="#0f172a" rx="3" />

      <rect y="38" width="370" height="54" fill="#ffffff" />
