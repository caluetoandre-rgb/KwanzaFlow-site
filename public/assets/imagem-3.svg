        <g transform="translate(18, 146)">
          <text x="0" y="6" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">(=) Lucro Líquido Disponível</text>
          <text x="330" y="6" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="900" fill="#059669">840.500 Kz</text>
        </g>
      </g>

      <!-- ALERTAS DE ESTOQUE CRÍTICO -->
      <g transform="translate(20, 502)">
        <text x="0" y="18" font-family="sans-serif" font-size="15" font-weight="900" fill="#0f172a">Controle de Estoque</text>
        <text x="366" y="18" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14b8a6">Novo Item +</text>

