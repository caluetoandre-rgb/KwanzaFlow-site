        <g transform="translate(0, 30)">
          <rect width="366" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" />
          <rect x="12" y="12" width="36" height="36" rx="10" fill="#fef2f2" />
          <text x="22" y="35" font-size="16">🍚</text>
          <text x="58" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Saco de Arroz 25kg (Tio Lucas)</text>
          <text x="58" y="43" font-family="sans-serif" font-size="11" fill="#dc2626">Restam apenas 3 unidades • Repor!</text>
          <rect x="280" y="16" width="74" height="26" rx="8" fill="#fef2f2" />
          <text x="317" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">CRÍTICO</text>
        </g>

