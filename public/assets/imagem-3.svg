        <text x="20" y="62" font-family="sans-serif" font-size="24" font-weight="900" fill="#dc2626">185.400,00 Kz</text>
        <text x="310" y="62" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">12 clientes</text>
