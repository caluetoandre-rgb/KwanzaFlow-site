<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Gradiente Fundo Modo Negócio -->
    <radialGradient id="bg-grad-3" cx="72%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#062020" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#031616" />
      <stop offset="100%" stop-color="#010d0d" />
    </radialGradient>

    <!-- Brilho Teal & Esmeralda -->
    <radialGradient id="glow-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glass-reflection-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="phone-rim-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-dre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>

    <filter id="shadow-deep-3" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-phone2-3" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="badge-glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14b8a6" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-grad-3)" />
  <circle cx="1400" cy="540" r="580" fill="url(#glow-3)" />

  <g opacity="0.08" stroke="#14b8a6" stroke-width="1.5">
    <circle cx="1380" cy="540" r="700" fill="none" stroke-dasharray="12 16" />
    <circle cx="1380" cy="540" r="850" fill="none" />
  </g>

  <!-- ==================== LADO ESQUERDO: COPYWRITING MODO NEGÓCIO ==================== -->
  <g transform="translate(110, 150)">
    <g filter="url(#badge-glow-teal)">
      <rect width="320" height="44" rx="22" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
      <circle cx="24" cy="22" r="6" fill="#14b8a6" />
      <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#5eead4" letter-spacing="1.5">3. MODO PRO NEGÓCIO</text>
    </g>

    <g transform="translate(0, 95)">
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Acesse o</text>
      <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" fill="#10b981" letter-spacing="-1.5">Modo Negócio</text>
      <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-1.5">para Empreendedores</text>
      <text x="0" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="600" fill="#5eead4" letter-spacing="-0.5">Estoque, Fiados e DRE Simplificado</text>
    </g>

    <g transform="translate(0, 620)">
