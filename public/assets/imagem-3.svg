          <text x="279" y="41" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">SMS ✉️</text>
        </g>

        <!-- Devedor 3 -->
        <g transform="translate(0, 172)">
          <rect width="330" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="34" cy="37" r="18" fill="#eff6ff" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">JM</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">João Manuel (Oficina)</text>
          <text x="64" y="46" font-family="sans-serif" font-size="11" fill="#64748b">Vence em 10 dias • 28.000 Kz</text>
          <rect x="240" y="24" width="78" height="26" rx="8" fill="#e2e8f0" />
          <text x="279" y="41" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">SMS ✉️</text>
        </g>
