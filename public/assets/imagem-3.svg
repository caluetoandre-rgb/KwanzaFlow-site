          <rect x="12" y="12" width="36" height="36" rx="10" fill="#ecfdf5" />
          <text x="22" y="35" font-size="16">🛢️</text>
          <text x="58" y="27" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Caixa de Óleo Alimentar 12L</text>
          <text x="58" y="43" font-family="sans-serif" font-size="11" fill="#059669">18 caixas em estoque • Seguro</text>
          <rect x="290" y="16" width="64" height="26" rx="8" fill="#ecfdf5" />
          <text x="322" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">OK</text>
        </g>
