          <rect width="330" height="74" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
          <circle cx="34" cy="37" r="18" fill="#fee2e2" />
          <text x="34" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">SB</text>
          <text x="64" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Sr. Bernardo (Armazém)</text>
