          <text x="330" y="12" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="900" fill="#059669">+2.450.000 Kz</text>
        </g>
        <!-- Linha 2: CMV -->
        <g transform="translate(18, 76)">
          <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(-) Custo das Mercadorias (CMV)</text>
          <text x="330" y="12" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="900" fill="#dc2626">-1.320.000 Kz</text>
        </g>
        <!-- Linha 3: Despesas Operacionais -->
        <g transform="translate(18, 108)">
          <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">(-) Energia, Funcionário e Transporte</text>
          <text x="330" y="12" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="900" fill="#dc2626">-289.500 Kz</text>
